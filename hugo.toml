baseURL = 'https://lijiayi-plus.github.io/'
title = "plusone's blog"

defaultContentLanguage = 'en'
locale = 'en-us'
timeZone = 'Asia/Shanghai'
hasCJKLanguage = true
enableEmoji = true

disableKinds = ['taxonomy', 'term']

[params]
  description = "Jiayi Li 的个人博客：CV 学习笔记、论文笔记与日常记录。"
  author = 'Jiayi Li'
  email = '2352692968@qq.com'
  github = 'https://github.com/lijiayi-plus'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 4

[menu]
  [[menu.main]]
    name = 'Article'
    pageRef = '/posts'
    weight = 10
    [menu.main.params]
      zh = '文章'
  [[menu.main]]
    name = 'Series'
    pageRef = '/series'
    weight = 20
    [menu.main.params]
      zh = '系列'
  [[menu.main]]
    name = 'Projects'
    pageRef = '/projects'
    weight = 30
    [menu.main.params]
      zh = '项目'
  [[menu.main]]
    name = 'Gallery'
    pageRef = '/gallery'
    weight = 40
    [menu.main.params]
      zh = '画廊'

